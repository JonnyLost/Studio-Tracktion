name: Linux Composer checks

on:
  workflow_dispatch:
  push:
    branches:
      - integration/studio-0.2-integrated-alpha
      - feature/studio-postintegration-composer-workflow-m6
      - feature/studio-keyboard-live-playback-feedback-m10
      - feature/studio-cinematic-keyboard-console-m11
      - feature/studio-atelier-keyboard-docking-m12
      - feature/studio-keyboard-dock-streamline-m13
      - feature/studio-atelier-piano-case-m14
      - feature/studio-keyboard-slate-theme-m15
      - feature/studio-atelier-slate-inspector-m16
      - feature/studio-apple-sounds-effects-browser-m17
      - feature/studio-dls-general-midi-library-m18
      - feature/studio-sampler-disk-streaming-m19
      - feature/studio-sfz-importer-m20
      - feature/studio-sound-bank-importer-m21
      - feature/studio-exs24-importer-m22
      - feature/studio-legacy-sampler-importer-m23
      - feature/studio-decent-kontakt-importer-m24
      - feature/studio-universal-library-m25
      - feature/studio-sampler-performance-m26
      - feature/studio-sampler-stabilization-m27
      - feature/studio-sampler-interface-m28
      - feature/studio-visual-library-m29
      - feature/studio-guided-instrument-builder-m30
      - feature/studio-contextual-help-m31
      - feature/studio-usability-acceptance-m32
      - feature/studio-design-system-m33
      - feature/studio-musical-workspaces-m34
      - feature/studio-cinematic-atelier-m35
      - feature/studio-environments-m36
      - feature/studio-workflow-refinement-m37
      - feature/studio-reliability-performance-m38
  pull_request:
    branches:
      - feature/studio-reliability-performance-m38
      - feature/studio-workflow-refinement-m37
      - feature/studio-environments-m36
      - feature/studio-cinematic-atelier-m35
      - feature/studio-musical-workspaces-m34
      - feature/studio-design-system-m33
      - feature/studio-usability-acceptance-m32
      - feature/studio-contextual-help-m31
      - feature/studio-guided-instrument-builder-m30
      - feature/studio-visual-library-m29
      - feature/studio-sampler-interface-m28
      - feature/studio-sampler-stabilization-m27
      - feature/studio-sampler-performance-m26
      - feature/studio-universal-library-m25
      - feature/studio-decent-kontakt-importer-m24
      - feature/studio-legacy-sampler-importer-m23
      - feature/studio-exs24-importer-m22
      - feature/studio-sound-bank-importer-m21
      - feature/studio-sfz-importer-m20
      - feature/studio-sampler-disk-streaming-m19
      - feature/studio-dls-general-midi-library-m18
      - feature/studio-mixer-inspector-m13
      - feature/studio-transport-header-m14
      - feature/studio-cinematic-atelier-m1
      - feature/studio-sampler-builder-m10
      - feature/studio-sampler-articulations-m11
      - feature/studio-composer-ui-m12-quickwins
      - feature/studio-midi-focus-m12
      - feature/studio-unified-track-headers-m12
      - feature/studio-simplified-navigation-m12
      - feature/studio-adaptive-workspace-m9
      - feature/studio-composer-workflow-m8
      - integration/studio-0.2-m7-baseline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install JUCE build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ladspa-sdk libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev libxcomposite-dev \
            libxrender-dev libxkbcommon-dev libgl1-mesa-dev xvfb xauth
      - name: Check streaming engine with sanitizers
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread tests/SamplerStreamingTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-streaming-tests"
          "$RUNNER_TEMP/studio-streaming-tests"
      - name: Check SFZ parser and voice playback before full build
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra tests/SfzParserTests.cpp -o "$RUNNER_TEMP/studio-sfz-parser-tests"
          "$RUNNER_TEMP/studio-sfz-parser-tests"
          clang++ -std=c++20 -O2 -Wall -Wextra -pthread tests/SfzPlaybackTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-sfz-playback-tests"
          "$RUNNER_TEMP/studio-sfz-playback-tests"
      - name: Check native bank parser with synthetic bank fixtures
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra tests/SoundBankTests.cpp -o "$RUNNER_TEMP/studio-bank-tests"
          "$RUNNER_TEMP/studio-bank-tests"
      - name: Check native EXS24 parser with endian and malformed fixtures
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra tests/ExsParserTests.cpp -o "$RUNNER_TEMP/studio-exs-tests"
          "$RUNNER_TEMP/studio-exs-tests"
      - name: Check sampler performance, shared allocations and indexed playback
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread tests/SamplerPerformanceTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-performance-tests"
          "$RUNNER_TEMP/studio-performance-tests"
      - name: Validate indexed sampler mapping, articulation and audio behavior
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread tests/SamplerEngineTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-engine-tests"
          "$RUNNER_TEMP/studio-engine-tests"
          c++ -std=c++20 -O2 -pthread tests/SamplerArticulationTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-articulation-tests"
          "$RUNNER_TEMP/studio-articulation-tests"
          c++ -std=c++20 -O2 -pthread tests/SamplerMappingTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-mapping-tests"
          "$RUNNER_TEMP/studio-mapping-tests"
      - name: Fetch pinned Tracktion Engine and JUCE
        run: |
          git init "$RUNNER_TEMP/tracktion-engine"
          git -C "$RUNNER_TEMP/tracktion-engine" fetch --depth 1 https://github.com/Tracktion/tracktion_engine.git c6293127cdc0a8488aea2ae0907f4709ee89c228
          git -C "$RUNNER_TEMP/tracktion-engine" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/tracktion-engine" -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --depth 1
      - name: Configure and build Studio
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTRACKTION_ROOT="$RUNNER_TEMP/tracktion-engine"
          cmake --build build --parallel 3
      - name: Run complete regression suite
        env:
          STUDIO_SAMPLER_SCREENSHOTS: ${{ runner.temp }}/studio-sampler-review
          STUDIO_INSTRUMENT_SCREENSHOTS: ${{ runner.temp }}/studio-instrument-workspace
          STUDIO_UNIFIED_STAGE_SCREENSHOTS: ${{ runner.temp }}/studio-unified-stage
          STUDIO_INTERFACE_SCREENSHOTS: ${{ runner.temp }}/studio-composer-images
          STUDIO_FILM_SCORING_SCREENSHOTS: ${{ runner.temp }}/studio-film-scoring
          STUDIO_COMPOSER_AUDIO: ${{ runner.temp }}/studio-composer-audio
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" ctest --test-dir build --output-on-failure --no-tests=error --output-junit "$RUNNER_TEMP/ctest-linux.xml"
      - name: Measure native synth block times
        run: |
          build/StudioSamplerBench > "$RUNNER_TEMP/studio-sampler-bench.tsv"
          build/StudioSynthBench --matrix > "$RUNNER_TEMP/studio-composer-bench.tsv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-composer-linux
          path: |
            ${{ runner.temp }}/studio-composer-images/
            ${{ runner.temp }}/studio-sampler-review/
            ${{ runner.temp }}/studio-instrument-workspace/
            ${{ runner.temp }}/studio-unified-stage/
            ${{ runner.temp }}/studio-film-scoring/
            ${{ runner.temp }}/studio-composer-audio/
            ${{ runner.temp }}/studio-composer-bench.tsv
            ${{ runner.temp }}/studio-sampler-bench.tsv
            ${{ runner.temp }}/ctest-linux.xml
            build/Studio_artefacts/Release/Studio
