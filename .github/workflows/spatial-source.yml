name: Spatial source DSP
on:
  workflow_dispatch:
  push:
    branches: ['feature/studio-native-spatial-*']
    paths:
      - 'SpatialSource.h'
      - 'tests/SpatialSourceTests.cpp'
      - '.github/workflows/spatial-source.yml'
  pull_request:
    branches: ['feature/studio-spatial-lab-*', 'feature/studio-native-spatial-*', 'feature/studio-acoustic-*']
    paths:
      - 'SpatialSource.h'
      - 'tests/SpatialSourceTests.cpp'
      - '.github/workflows/spatial-source.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Optimized regression and response measurements
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror tests/SpatialSourceTests.cpp -o "$RUNNER_TEMP/spatial-source"
          "$RUNNER_TEMP/spatial-source" | tee "$RUNNER_TEMP/spatial-source-response.txt"
        shell: bash
      - name: Address and undefined-behavior sanitizer tests
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/SpatialSourceTests.cpp -o "$RUNNER_TEMP/spatial-source-sanitized"
          "$RUNNER_TEMP/spatial-source-sanitized"
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-source-response-${{ matrix.os }}
          path: ${{ runner.temp }}/spatial-source-response.txt
