      - feature/studio-composer-acceptance-m39e
      - feature/studio-themes-icons-m39d
      - feature/studio-inspector-controls-m39c
      - feature/studio-instrument-library-m39b
      - feature/studio-composer-refinement-m39a
      - feature/studio-reliability-performance-m38
      - feature/studio-workflow-refinement-m37
      - feature/studio-environments-m36
      - feature/studio-cinematic-atelier-m35
      - feature/studio-musical-workspaces-m34
      - feature/studio-design-system-m33
      - feature/studio-usability-acceptance-m32
      - feature/studio-contextual-help-m31
      - feature/studio-guided-instrument-builder-m30
      - feature/studio-visual-library-m29
      - feature/studio-sampler-interface-m28
      - feature/studio-sampler-stabilization-m27
      - feature/studio-sampler-performance-m26
      - feature/studio-universal-library-m25
      - feature/studio-decent-kontakt-importer-m24
      - feature/studio-legacy-sampler-importer-m23
      - feature/studio-exs24-importer-m22
      - feature/studio-sound-bank-importer-m21
      - feature/studio-sfz-importer-m20
      - feature/studio-sampler-disk-streaming-m19
      - feature/studio-dls-general-midi-library-m18
      - feature/studio-mixer-inspector-m13
      - feature/studio-transport-header-m14
      - feature/studio-cinematic-atelier-m1
      - feature/studio-sampler-builder-m10
      - feature/studio-sampler-articulations-m11
      - feature/studio-composer-ui-m12-quickwins
      - feature/studio-midi-focus-m12
      - feature/studio-unified-track-headers-m12
      - feature/studio-simplified-navigation-m12
      - feature/studio-adaptive-workspace-m9
      - feature/studio-composer-workflow-m8
      - integration/studio-0.2-m7-baseline
      - development
      - feature/studio-orchestral-stage-m4
      - feature/studio-acoustic-engine-m4r
      - feature/studio-professional-interface-m45
      - feature/studio-native-sampler-m5
      - feature/studio-native-synth-m6
      - feature/studio-unified-integration-m6
      - feature/studio-unified-instruments-m65
      - feature/studio-orchestral-seating-m1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seating-swift:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check native seating views and run the model tests
        run: |
          xcrun swiftc -swift-version 5 -target x86_64-apple-macosx14.0 -typecheck -D STUDIO_SEATING_TESTS Seating/*.swift
          xcrun swiftc -swift-version 5 -target x86_64-apple-macosx14.0 Seating/SeatingModel.swift Seating/SeatingCatalog.swift tests/SeatingModelTests.swift -o "$RUNNER_TEMP/studio-seating-tests"
          "$RUNNER_TEMP/studio-seating-tests"
  build:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      STUDIO_CONFIG: ${{ github.ref == 'refs/heads/integration/studio-0.2-m44-consolidated' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test Studio appearance metrics
        run: |
          c++ -std=c++20 -Wall -Wextra -pedantic tests/AppearanceMetricsTests.cpp -o "$RUNNER_TEMP/studio-appearance-tests"
          "$RUNNER_TEMP/studio-appearance-tests"
      - name: Check streaming engine before the full macOS build
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -pthread tests/SamplerStreamingTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-streaming-tests"
          "$RUNNER_TEMP/studio-streaming-tests"
      - name: Check SFZ parser and voice playback before full build
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra tests/SfzParserTests.cpp -o "$RUNNER_TEMP/studio-sfz-parser-tests"
          "$RUNNER_TEMP/studio-sfz-parser-tests"
          c++ -std=c++20 -O2 -Wall -Wextra -pthread tests/SfzPlaybackTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-sfz-playback-tests"
          "$RUNNER_TEMP/studio-sfz-playback-tests"
      - name: Check native bank parser with synthetic bank fixtures
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra tests/SoundBankTests.cpp -o "$RUNNER_TEMP/studio-bank-tests"
          "$RUNNER_TEMP/studio-bank-tests"
      - name: Check native EXS24 parser with endian and malformed fixtures
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra tests/ExsParserTests.cpp -o "$RUNNER_TEMP/studio-exs-tests"
          "$RUNNER_TEMP/studio-exs-tests"
      - name: Check sampler performance, shared allocations and indexed playback
        run: |
          c++ -std=c++20 -O2 -pthread tests/SamplerPerformanceTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-performance-tests"
          "$RUNNER_TEMP/studio-performance-tests"
      - name: Validate indexed sampler mapping, articulation and audio behavior
        run: |
          c++ -std=c++20 -O2 -pthread tests/SamplerEngineTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-engine-tests"
          "$RUNNER_TEMP/studio-engine-tests"
          c++ -std=c++20 -O2 -pthread tests/SamplerArticulationTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-articulation-tests"
          "$RUNNER_TEMP/studio-articulation-tests"
          c++ -std=c++20 -O2 -pthread tests/SamplerMappingTests.cpp SamplerEngine.cpp -o "$RUNNER_TEMP/studio-mapping-tests"
          "$RUNNER_TEMP/studio-mapping-tests"
      - name: Fetch pinned Tracktion Engine and JUCE
        run: |
          git init "$RUNNER_TEMP/tracktion-engine"
          git -C "$RUNNER_TEMP/tracktion-engine" remote add origin https://github.com/Tracktion/tracktion_engine.git
          git -C "$RUNNER_TEMP/tracktion-engine" fetch --depth 1 origin c6293127cdc0a8488aea2ae0907f4709ee89c228
          git -C "$RUNNER_TEMP/tracktion-engine" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/tracktion-engine" -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --depth 1
      - name: Configure and build Studio
        id: studio-build
        run: |
          cmake -S . -B build -G Xcode \
            -DTRACKTION_ROOT="$RUNNER_TEMP/tracktion-engine" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build build --config "$STUDIO_CONFIG" --target Studio StudioOstinatoCoreTests StudioEnvironmentTests StudioMidiFocusPolicyTests StudioKeyboardNoteStateTests StudioKeyboardPerformanceStateTests StudioGeneralMidiBankTests StudioMilestoneTests StudioSpatialTests StudioAcousticComparison StudioSamplerEngineTests StudioSamplerStreamingTests StudioSamplerPerformanceTests StudioSfzParserTests StudioSfzPlaybackTests StudioSoundBankTests StudioExsParserTests StudioSamplerArticulationTests StudioSamplerMappingTests StudioSynthValidation StudioSeatingModelTests StudioFilmScoringTests StudioFilmCueSheetTests StudioFilmPictureSyncTests StudioFilmCueDeliveryTests StudioFilmStemDeliveryTests --parallel 4
          test "$(lipo -archs build/Studio_artefacts/$STUDIO_CONFIG/Studio.app/Contents/MacOS/Studio)" = x86_64
      - name: Test Studio and render interface review
        env:
          STUDIO_INSTRUMENT_SCREENSHOTS: ${{ runner.temp }}/studio-instrument-workspace
          STUDIO_SEATING_SCREENSHOTS: ${{ runner.temp }}/studio-seating-review
          STUDIO_UNIFIED_STAGE_SCREENSHOTS: ${{ runner.temp }}/studio-unified-stage
          STUDIO_SYNTH_SCREENSHOTS: ${{ runner.temp }}/studio-synth-review
          STUDIO_SAMPLER_SCREENSHOTS: ${{ runner.temp }}/studio-sampler-review
          STUDIO_FILM_SCORING_SCREENSHOTS: ${{ runner.temp }}/studio-film-scoring
          STUDIO_COMPOSER_AUDIO: ${{ runner.temp }}/studio-composer-audio
          STUDIO_M9_SCREENSHOTS: ${{ runner.temp }}/studio-m9-review
          STUDIO_INTERFACE_SCREENSHOTS: ${{ runner.temp }}/studio-interface-review
        run: ctest --test-dir build -C "$STUDIO_CONFIG" --verbose --output-on-failure --no-tests=error --output-junit "$RUNNER_TEMP/ctest-intel-macos.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-M9-macOS-gallery
          path: ${{ runner.temp }}/studio-m9-review/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-composer-intel-macos
          path: |
            ${{ runner.temp }}/studio-interface-review/composer-*.png
            ${{ runner.temp }}/studio-film-scoring/
            ${{ runner.temp }}/studio-composer-audio/
            ${{ runner.temp }}/ctest-intel-macos.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-M13-mixer-inspector-macOS
          path: |
            ${{ runner.temp }}/studio-interface-review/mixer-*.png
            ${{ runner.temp }}/studio-interface-review/right-inspector-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-M6-unified-interface-review
          path: ${{ runner.temp }}/studio-interface-review/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-M11-sampler-review
          path: ${{ runner.temp }}/studio-sampler-review/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-M6-synth-review
          path: ${{ runner.temp }}/studio-synth-review/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-M11-workspace
          path: ${{ runner.temp }}/studio-instrument-workspace/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-Orchestral-Seating-macOS
          path: ${{ runner.temp }}/studio-seating-review/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-M7-unified-stage-macOS
          path: ${{ runner.temp }}/studio-unified-stage/
          if-no-files-found: error
      - name: Package integrated Intel Studio application
        if: github.ref == 'refs/heads/integration/studio-0.2-integrated-alpha'
        id: integrated-app
        shell: bash
        run: |
          archive=Studio-0.2-Integrated-Alpha-Intel
          if [[ ! -f assets/Studio.png ]]; then
            archive=Studio-0.2-Integrated-Alpha-Intel-preview
            echo "::warning::Approved assets/Studio.png is pending. This archive is a preview."
          else
            bundle=build/Studio_artefacts/$STUDIO_CONFIG/Studio.app/Contents
            icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$bundle/Info.plist")
            test "$icon" = AppIcon.icns
            test -s "$bundle/Resources/$icon"
            sips -g pixelWidth -g pixelHeight assets/Studio.png | grep -q 'pixelWidth: 1024'
            sips -g pixelHeight assets/Studio.png | grep -q 'pixelHeight: 1024'
          fi
          tools/package-intel-studio.sh build/Studio_artefacts/$STUDIO_CONFIG/Studio.app "$RUNNER_TEMP/$archive.zip"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.integrated-app.outputs.archive != ''
        with:
          name: ${{ steps.integrated-app.outputs.archive }}
          path: ${{ runner.temp }}/${{ steps.integrated-app.outputs.archive }}.zip
          if-no-files-found: error
      - name: Verify and package M44 Intel Release
        id: m44-package
        if: ${{ !cancelled() && steps.studio-build.outcome == 'success' && github.ref == 'refs/heads/integration/studio-0.2-m44-consolidated' }}
        run: |
          if [[ -f assets/Studio.png ]]; then
            export STUDIO_ICON_FILE=assets/Studio.png
          else
            echo "::warning::Approved Studio icon is pending. This is an M44 preview bundle."
          fi
          tools/package-intel-studio.sh build/Studio_artefacts/Release/Studio.app "$RUNNER_TEMP/Studio-M44-Intel-preview.zip"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.m44-package.outcome == 'success' }}
        with:
          name: Studio-M44-Intel-preview
          path: ${{ runner.temp }}/Studio-M44-Intel-preview.zip
          if-no-files-found: error
      - name: Package Intel Studio application
        if: github.ref != 'refs/heads/integration/studio-0.2-integrated-alpha' && github.ref != 'refs/heads/integration/studio-0.2-m44-consolidated'
        run: ditto -c -k --sequesterRsrc --keepParent build/Studio_artefacts/$STUDIO_CONFIG/Studio.app "$RUNNER_TEMP/Studio-M13-Intel.zip"
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/integration/studio-0.2-integrated-alpha' && github.ref != 'refs/heads/integration/studio-0.2-m44-consolidated'
        with:
          name: Studio-M13-Intel-app
          path: ${{ runner.temp }}/Studio-M13-Intel.zip
          if-no-files-found: error
      - name: Measure optimized native synth block times
        run: |
          cmake --build build --config Release --target StudioSynthBench StudioSamplerBench --parallel 4
          build/Release/StudioSamplerBench > "$RUNNER_TEMP/studio-sampler-bench.tsv"
          build/Release/StudioSynthBench --matrix > "$RUNNER_TEMP/studio-synth-bench.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-M11-sampler-bench
          path: |
            ${{ runner.temp }}/studio-synth-bench.tsv
            ${{ runner.temp }}/studio-sampler-bench.tsv
          if-no-files-found: error
      - name: Compare acoustic engines
        run: tools/compare-acoustics.sh "$RUNNER_TEMP/studio-acoustic-comparison"
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-M4R-acoustic-comparison
          path: ${{ runner.temp }}/studio-acoustic-comparison/
